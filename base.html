<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}FitBuddy{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<nav>

    <div class="logo">
        FitBuddy
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/planner">
            Planner
        </a>

        <a href="/nutrition">
            Nutrition
        </a>

        <a href="/feedback">
            Feedback
        </a>

        <a href="/view-all-users">
            Admin
        </a>

    </div>

</nav>


<main class="container">

    {% if error %}

    <div class="alert error">
        {{ error }}
    </div>

    {% endif %}


    {% block content %}

    {% endblock %}

</main>


<script src="/static/js/app.js"></script>

</body>

</html>
